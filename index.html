<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice to Post</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <span class="badge">VOICE TO POST</span>
    <h1>Your next post starts with your voice.</h1>
    <p>Speak your ideas, refine your words, and create your post.</p>

    <section>
  <h2>Your Buffer account</h2>

  <a href="/auth/buffer" id="connectBuffer">
    Connect Buffer
  </a>

  <p id="bufferStatus" role="status">
    Checking connection…
  </p>
</section>

    <section>
      <h2>1. Speak your idea</h2>

      <div class="buttons">
        <button id="dictate">Start dictation</button>
        <button id="endDictation" disabled>Stop dictation</button>
      </div>

      <p id="dictationStatus" role="status">
        Ready when you are.
      </p>
      
      <div id="socialAccountsSection">
        <h3>Choose social accounts</h3>
        <p id="channelStatus" role="status">Loading your connected accounts...</p>
        <div id="socialAccounts"></div>
      </div>

      <label for="transcript">Your words</label>
      <textarea
        id="transcript"
        rows="7"
        placeholder="Dictate or type your ideas here."
      ></textarea>

      <div class="buttons">
        <button id="formalise">Formalise text</button>
        <button id="undoFormalise" disabled>Undo formalisation</button>
      </div>

      <p id="formaliseStatus" role="status"></p>
    </section>

    <section>
      <h2>2. Shape your post</h2>

      <label for="headline">Opening line</label>
      <input
        id="headline"
        type="text"
        placeholder="Add an optional opening line."
      >

      <button id="generate">Create draft</button>
      <p id="draftStatus" role="status"></p>

      <label for="postDraft">Your post draft</label>
      <textarea
        id="postDraft"
        rows="9"
        placeholder="Your editable draft will appear here."
      ></textarea>

      <button id="copyPost">Copy post</button>
      <p id="formaliseStatus" role="status"></p>
      <button id="postNow">Post now</button>
      <p id="publishStatus" role="status"></p>
  </main>
</body>
</html>
